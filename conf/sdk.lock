# Pinned Android SDK archives for scripts/provision-sdk.sh.
#
# Columns: package, revision, archive, SHA-256 of the archive.
# The revision is Pkg.Revision in the source.properties of the package.
# The archive path is relative to APPLIANCE_SDK_REPOSITORY (default
# https://dl.google.com/android/repository).
#
# The first line of a package gives its default revision. Keep the old
# lines when you add a new revision, because an appliance.conf can pin
# an old revision. To find a new archive, read repository2-3.xml (or
# sys-img/google_apis_playstore/sys-img2-3.xml) in the repository. Google
# publishes a SHA-1 there; download the archive, compare the SHA-1, and
# record the SHA-256 here.
#
# A host can add lines in /etc/android-appliance/sdk.lock. That file is
# read first.

