name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      # podman brings the Quadlet generator for the staged units; uv
      # creates the virtual environment of the Python tests.
      - name: Install the test dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            bash coreutils grep sed gawk util-linux \
            shellcheck systemd curl unzip podman uv python3 nodejs
      # The tests stage every installation; the job builds no image.
      - name: Run the tests
        run: ./run-tests.sh

