name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4
      - name: Install the test dependencies
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            bash coreutils grep sed gawk util-linux \
            shellcheck systemd polkit dnf-plugins-core curl unzip \
            python3 python3-aiohttp python3-fastapi python3-httpx python3-pyyaml nodejs \
            tigervnc-x11-server xdpyinfo python3-websockify novnc libXScrnSaver
          # Fedora 44 ships no scrcpy; the zeno/scrcpy COPR provides it.
          dnf copr enable -y zeno/scrcpy
          dnf install -y scrcpy
      # The CI job does not download the Android SDK (about 2.5 GB).
      - name: Install the appliance
        run: APPLIANCE_SDK_MANAGED=0 ./install.sh
      - name: Run the tests
        run: ./run-tests.sh

  hermes-plugin:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the Hermes release that runs the plugin.
      HERMES_REF: v2026.9.24
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes
      - uses: astral-sh/setup-uv@v6
      # Hermes does not build wheels, so run it from a synced checkout.
      - name: Validate the plugin with Hermes
        working-directory: hermes
        run: |
          uv sync --python 3.13
          export HERMES_HOME="$(mktemp -d)"
          uv run --no-sync hermes plugins validate ../plugin
          uv run --no-sync hermes plugins doctor ../plugin --ci
      # The install scan blocks community plugins with high findings.
      - name: Install the plugin with Hermes
        working-directory: hermes
        run: |
          export HOME="$(mktemp -d)" HERMES_HOME="$(mktemp -d)"
          uv run --no-sync hermes plugins install "file://$GITHUB_WORKSPACE/plugin" --enable < /dev/null
          test -f "$HERMES_HOME/plugins/android-appliance/plugin.yaml"
