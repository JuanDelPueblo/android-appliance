name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check

  hermes-plugin:
    runs-on: ubuntu-latest
    env:
      # Keep in step with the Hermes release that runs the plugin.
      HERMES_REF: v2026.9.14
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ env.HERMES_REF }}
          path: hermes
      - uses: astral-sh/setup-uv@v6
      # Hermes does not build wheels, so run it from a synced checkout.
      - name: Validate the plugin with Hermes
        working-directory: hermes
        run: |
          uv sync --python 3.13
          export HERMES_HOME="$(mktemp -d)"
          uv run --no-sync hermes plugins validate ../plugin
          uv run --no-sync hermes plugins doctor ../plugin --ci
      # The install scan blocks community plugins with high findings.
      - name: Install the plugin with Hermes
        working-directory: hermes
        run: |
          export HOME="$(mktemp -d)" HERMES_HOME="$(mktemp -d)"
          uv run --no-sync hermes plugins install "file://$GITHUB_WORKSPACE/plugin" --enable < /dev/null
          test -f "$HERMES_HOME/plugins/android-appliance/plugin.yaml"
